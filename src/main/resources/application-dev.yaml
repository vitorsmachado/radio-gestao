# =============================================================================
# radio-gestao — Perfil DEV
# Ativo quando PROFILE=dev (padrão)
#
# Requer PostgreSQL rodando localmente ou via Docker:
#   docker compose up -d
# =============================================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:radiogestao_dev}
    username: ${DB_USER:radiogestao}
    password: ${DB_PASS:radiogestao}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RadiogestaoDev
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

logging:
  level:
    com.radiocom: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
