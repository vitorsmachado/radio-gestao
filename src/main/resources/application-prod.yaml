# =============================================================================
# radio-gestao — Perfil PROD
# Ativo quando PROFILE=prod
#
# Sem valores padrão para credenciais: se DB_* ou JWT_SECRET faltarem, a
# aplicação não sobe (melhor do que subir com a senha de dev).
# =============================================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RadiogestaoProd
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      # Mesmo motivo do perfil dev — ver application-dev.yaml
      data-source-properties:
        preferQueryMode: simple

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    com.radiocom: INFO
