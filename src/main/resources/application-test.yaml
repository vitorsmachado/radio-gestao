# =============================================================================
# radio-gestao — Perfil TEST
# Usado pelos testes unitários que sobem o contexto Spring (sem banco real)
# =============================================================================
spring:
  datasource:
    url: jdbc:h2:mem:radiogestao_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

jwt:
  secret: chave-secreta-de-teste-nao-usar-em-producao
  expiration: 3600000

integracao:
  receitaws:
    habilitado: false

logging:
  level:
    com.radiocom: INFO
